<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mallet</title>
    <style>
      /* The boot banner: painted before any script runs, in the editor's colours. */
      html,
      body {
        margin: 0;
        background: #12151c;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #1c2130 0%, #12151c 70%);
        color: #d6dae3;
        font:
          14px/1.4 "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          sans-serif;
        transition: opacity 0.4s ease;
        user-select: none;
      }
      .boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5));
        animation: boot-in 0.6s ease-out both;
      }
      .boot-name {
        margin-top: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #f1f3f7;
      }
      .boot-tag {
        margin-top: 2px;
        font-size: 13px;
        color: #8a93a6;
      }
      .boot-bar {
        width: 220px;
        height: 3px;
        margin-top: 26px;
        border-radius: 2px;
        background: #232938;
        overflow: hidden;
      }
      .boot-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #2a9dae;
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      .boot-status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: #8a93a6;
      }
      .boot-version {
        position: absolute;
        right: 14px;
        bottom: 10px;
        font-size: 11px;
        color: #5c6477;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(290%);
        }
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #e9eaef;
      }
      html[data-theme="light"] .boot {
        background: radial-gradient(ellipse at 50% 40%, #f6f7fa 0%, #e9eaef 70%);
        color: #2a2f3a;
      }
      html[data-theme="light"] .boot-name {
        color: #1d2230;
      }
      html[data-theme="light"] .boot-bar {
        background: #d5d9e2;
      }
      html[data-theme="light"] .boot-version {
        color: #8a93a6;
      }
    </style>
    <script>
      // The saved theme, so the banner matches the editor that follows.
      try {
        if (localStorage.getItem("gme.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot" class="boot" aria-hidden="true">
      <img class="boot-logo" src="/brand/mallet-256.png" alt="" />
      <div class="boot-name">Mallet</div>
      <div class="boot-tag" id="boot-tag">Source · Garry's Mod</div>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <div class="boot-status" id="boot-status"></div>
      <div class="boot-version" id="boot-version"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
