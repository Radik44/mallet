[workspace]
resolver = "2"
members = ["crates/*", "apps/editor/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/your-org/gmod-map-editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
glam = "0.30"

# Faster debug builds of dependencies (Tauri, wgpu-free frontend build is unaffected).
[profile.dev.package."*"]
opt-level = 1
